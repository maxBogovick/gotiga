[package]
name = "gotiga-server"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.7", features = ["multipart"] }
tokio = { version = "1.0", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "sqlite", "uuid", "chrono"] }
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["cors", "fs", "trace", "limit"] }
uuid = { version = "1.0", features = ["serde", "v4"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"
mime_guess = "2.0"
rand = "0.8"
anyhow = "1.0.100"
argon2 = "0.5"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
maxminddb = "0.24"
reqwest = { version = "0.11", features = ["json", "rustls-tls"], default-features = false }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
lettre = { version = "0.11", features = ["tokio1-rustls-tls", "smtp-transport", "builder"], default-features = false }
# On-demand depth maps ("Living Daguerreotype"): Depth-Anything-V2 inference in
# pure Rust on CPU — no Python, no torch image. Weights are bundled at build time.
candle-core = "0.9"
candle-nn = "0.9"
candle-transformers = "0.9"
# Semantic search ("Хранитель"): on-device multilingual text embeddings (candle,
# XLM-RoBERTa / multilingual-e5). tokenizers loads the checkpoint's tokenizer.json.
# `onig` is REQUIRED, not optional: tokenizers 0.20.4 compiles src/utils/onig.rs
# unconditionally, so dropping the feature (even for `fancy-regex`) fails to build.
# It pulls oniguruma (C), which the Docker builder already cross-compiles via its
# gcc-x86-64-linux-gnu toolchain (CC_x86_64_unknown_linux_gnu). default-features
# off still trims the http/progressbar/training extras we don't use.
tokenizers = { version = "0.20", default-features = false, features = ["onig"] }
webp = "0.3"

[dev-dependencies]
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "migrate"] }
reqwest = { version = "0.11", features = ["json", "rustls-tls", "multipart"], default-features = false }
