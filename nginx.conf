server {
    listen 80;
    root /usr/share/nginx/html;
    # Prerendered home is index.html; app.html is only the SPA fallback (see below).
    index index.html;

    # Allow large media uploads (hero image, figurine photos/videos).
    # Must be >= the backend's MEDIA_UPLOAD_LIMIT (256 MB) or nginx returns 413
    # before the request reaches the app.
    client_max_body_size 256m;

    # Baseline security headers. NB: nginx's add_header inheritance is replace, not
    # merge — any location declaring its own add_header loses these. Every location
    # below that sets Cache-Control therefore re-includes the same snippet.
    include /etc/nginx/snippets/security-headers.conf;

    # ── Compression ──────────────────────────────────────────────────────────
    # nginx ships with gzip OFF, so every JS/CSS byte was going over the wire raw.
    # Measured on this bundle: the global stylesheet (loaded on EVERY page) is
    # 138 KB raw / 25 KB gzipped; the figurine-detail chunk 138 KB / 45 KB.
    #
    # gzip_types deliberately omits text/html: nginx always gzips text/html when
    # gzip is on, and naming it again triggers a "duplicate MIME type" warning.
    # Images/video/woff2 are left out on purpose — they are already compressed,
    # so re-compressing them burns CPU for ~0 bytes.
    #
    # gzip_vary adds `Vary: Accept-Encoding` so shared caches (Cloudflare sits in
    # front of this) never hand a gzipped body to a client that can't decode it.
    # Level 6 is the standard ratio/CPU knee — 9 costs noticeably more CPU for
    # roughly a percent of size.
    gzip              on;
    gzip_vary         on;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/css
                      text/plain
                      text/xml
                      application/javascript
                      application/json
                      application/manifest+json
                      application/xml
                      image/svg+xml;

    # Anything reaching the SPA fallback is either a client-only route (noindex) or a
    # non-existent URL, so respond 404 (the SvelteKit app still renders client-side).
    # This prevents soft-404s — unknown URLs returning 200 with an empty shell, which
    # Google flags and which waste crawl budget.
    error_page 404 /app.html;

    # Proxy API requests to the Rust backend
    location /api/ {
        proxy_pass         http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        # TLS is terminated upstream (Cloudflare); nginx itself listens on plain :80,
        # so $scheme is always "http". Hardcode https — the public site is https-only
        # (http is 308-redirected) — so the backend builds correct absolute URLs
        # (e.g. sitemap <loc> entries) instead of http:// ones.
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }

    # Dynamic sitemap generated by the backend (lists all visible figurines)
    location = /sitemap.xml {
        proxy_pass         http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        # TLS is terminated upstream (Cloudflare); nginx itself listens on plain :80,
        # so $scheme is always "http". Hardcode https — the public site is https-only
        # (http is 308-redirected) — so the backend builds correct absolute URLs
        # (e.g. sitemap <loc> entries) instead of http:// ones.
        proxy_set_header   X-Forwarded-Proto https;
    }

    # Dynamic RSS feed generated by the backend — the URL connected to Pinterest's
    # "Подключить RSS-канал". Same shape as /sitemap.xml above: proxied to the app so a
    # work added in the admin appears in the feed at once (no redeploy), and the
    # https X-Forwarded-Proto lets the backend build absolute image/link URLs on the
    # claimed domain (Pinterest requires both).
    location = /feed.xml {
        proxy_pass         http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
    }

    # Proxy file uploads served by the backend.
    #
    # The previous `proxy_cache_valid 200 1d;` here was dead: proxy_cache_valid only
    # does something when a `proxy_cache <zone>` is active, and no zone is declared
    # (that needs proxy_cache_path at http{} level). So it cached nothing AND set no
    # Cache-Control — meaning the browser revalidated every single photo on every
    # page view. A figurine page with 20 photos paid 20 conditional round-trips.
    #
    # We don't need an nginx-side cache here at all — the backend serves these off
    # local disk. What was missing is a *browser* caching policy, and it differs by
    # subdirectory, so the two cases are split below.

    # Content-addressed media: the upload handler names every file after a fresh
    # Uuid::new_v4() (handlers.rs — images/{original,preview,thumb}/{uuid}.{jpg,webp},
    # and the same for videos/audio/avatars). A given URL therefore never changes
    # content: editing a figurine's photo mints a new UUID and thus a new URL. That is
    # precisely the contract `immutable` asks for, so we can skip revalidation for a
    # year — the browser won't even send a conditional request.
    location ~* ^/static/(images|videos|audio|avatars)/ {
        proxy_pass         http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host            $host;
        proxy_set_header   X-Real-IP       $remote_addr;
        include            /etc/nginx/snippets/security-headers.conf;
        add_header         Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Backgrounds are the exception and MUST NOT be immutable: the handler writes them
    # to a fixed name (`cabinet-bg.{ext}`), overwriting in place, so the URL is stable
    # while the bytes change. Marking it immutable would pin a stale background in
    # every visitor's browser for a year after the admin swaps it.
    #
    # `no-cache` is not "don't cache" — it means "cache it, but revalidate before
    # reuse". The backend's ServeDir sends ETag/Last-Modified, so a background that
    # hasn't changed costs one 304 with no body, and a changed one is picked up at once.
    location /static/backgrounds/ {
        proxy_pass         http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host            $host;
        proxy_set_header   X-Real-IP       $remote_addr;
        include            /etc/nginx/snippets/security-headers.conf;
        add_header         Cache-Control "no-cache" always;
    }

    # Any other /static/ subdir the backend may mount later: safe default.
    location /static/ {
        proxy_pass         http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host            $host;
        proxy_set_header   X-Real-IP       $remote_addr;
        include            /etc/nginx/snippets/security-headers.conf;
        add_header         Cache-Control "public, max-age=3600" always;
    }

    # Bundled frontend assets (header avatar, raven walk-cycle frames, workshop teaser
    # clips/posters) — shipped from the SvelteKit build's static/ dir, so unlike
    # /static/images/ above these are NOT content-addressed: the filename stays the
    # same across deploys even if someone swaps the source file and rebuilds. That
    # rules out `immutable` for the same reason the backgrounds block above avoids it
    # — it would pin a stale asset in every visitor's browser for a year. But with no
    # policy at all here, these were falling through to the generic location below
    # with no Cache-Control, leaving Cloudflare's ~4h default heuristic to force a
    # re-fetch on almost every return visit. A day is long enough to matter for a
    # repeat visitor, short enough that a swapped asset isn't stuck for long after
    # the rare manual deploy.
    location /images/ {
        include    /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=86400, must-revalidate" always;
    }

    # Serve the PWA manifest with its proper MIME type (nginx's default mime.types
    # has no entry for .webmanifest, so it would fall back to octet-stream).
    location = /site.webmanifest {
        default_type application/manifest+json;
    }

    # Aggressively cache immutable assets (Vite fingerprints them).
    # The security-headers include is not decorative: the add_header below was already
    # silently dropping nosniff/Referrer-Policy/X-Frame-Options for every JS and CSS
    # file on the site, for the inheritance reason explained above.
    # `expires 1y` is deliberately NOT used here: it emits its own Cache-Control
    # (max-age=31536000) alongside the add_header below, so the response carried two
    # conflicting Cache-Control headers. One explicit header states the whole policy.
    location ~* /_app/immutable/ {
        include    /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Static prerendered pages first, then SPA fallback.
    #   $uri       — exact file (e.g. /llms.txt, /robots.txt, /_app/...)
    #   $uri.html  — clean URL → prerendered page (/author → /author.html,
    #                /figurines/<id> → /figurines/<id>.html). WITHOUT this, every
    #                prerendered route falls through to the empty SPA shell and bots
    #                see no content.
    #   $uri/      — directory (serves its index.html, incl. / → /index.html)
    #   =404       — nothing matched → 404, handled by `error_page 404 /app.html`
    #                above (serves the SPA shell with a 404 status; client routes like
    #                /admin still render client-side).
    location / {
        try_files $uri $uri.html $uri/ =404;
    }
}
