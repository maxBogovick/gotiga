server {
    listen 80;
    root /usr/share/nginx/html;
    index app.html;

    # Allow large media uploads (hero image, figurine photos/videos).
    # Must be >= the backend's MEDIA_UPLOAD_LIMIT (256 MB) or nginx returns 413
    # before the request reaches the app.
    client_max_body_size 256m;

    # Proxy API requests to the Rust backend
    location /api/ {
        proxy_pass         http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Dynamic sitemap generated by the backend (lists all visible figurines)
    location = /sitemap.xml {
        proxy_pass         http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Proxy file uploads served by the backend
    location /static/ {
        proxy_pass         http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host            $host;
        proxy_set_header   X-Real-IP       $remote_addr;
        proxy_cache_valid  200 1d;
    }

    # Aggressively cache immutable assets (Vite fingerprints them)
    location ~* /_app/immutable/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback — all unknown paths go to the SvelteKit entry point
    location / {
        try_files $uri $uri/ /app.html;
    }
}
