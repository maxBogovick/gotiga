services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${DB_USER:-gotiga}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-gotiga_password}
      POSTGRES_DB:       ${DB_NAME:-gotiga}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-gotiga} -d ${DB_NAME:-gotiga}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Rust API server ─────────────────────────────────────────────────────────
  app:
    build: ./src-tauri/server
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${DB_USER:-gotiga}:${DB_PASSWORD:-gotiga_password}@db:5432/${DB_NAME:-gotiga}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-change_me_in_prod}
      PUBLIC_URL:   ${PUBLIC_URL:-http://localhost}
      UPLOAD_DIR:   /app/uploads
      RUST_LOG:     ${RUST_LOG:-info,sqlx=warn}
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  # ── SvelteKit frontend (nginx) ──────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      app:
        condition: service_healthy

volumes:
  pgdata:
  uploads:
