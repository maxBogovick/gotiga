<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <link rel="icon" href="%sveltekit.assets%/favicon.ico" sizes="any" />
  <link rel="icon" href="%sveltekit.assets%/favicon-32x32.png" sizes="32x32" type="image/png" />
  <link rel="icon" href="%sveltekit.assets%/favicon-16x16.png" sizes="16x16" type="image/png" />
  <link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
  <link rel="manifest" href="%sveltekit.assets%/site.webmanifest" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- No default page description here on purpose: every prerendered route sets its
         own meta description in its head block, and a hardcoded default would duplicate
         it on every page. -->
  <meta name="theme-color" content="#f8f1e7" />
  <meta name="color-scheme" content="light" />

  <!-- Pinterest domain verification -->
  <meta name="p:domain_verify" content="66643aea03656a7643a697e69c62b766" />

  <!-- RSS feed of new works — the URL connected to Pinterest's "Подключить RSS-канал";
         also lets readers/aggregators auto-discover new arrivals. Gazette leaves have
         their own channel so WIP sketches and notes do not land on the pin board. -->
  <link rel="alternate" type="application/rss+xml" title="Ritunia — new exclusive and one of a kind works"
    href="/feed.xml" />
  <link rel="alternate" type="application/rss+xml" title="Ritunia — leaves of the cabinet"
    href="/gazette/feed.xml" />

  <!-- Site typography. ONE stylesheet, a superset of every family used statically across
         routes (incl. the design tokens in app.css: Fraunces → --font-display, DM Sans →
         --font-body, EB Garamond → --font-serif). Reader-selectable and admin-preview fonts
         are still loaded on demand by their own stores. -->
  <!-- Self-hosted fonts (generated by scripts/fetch-fonts.mjs). Same-origin, so there is no
       preconnect and no third-party origin on the render path; `font-display: swap` lives in
       the CSS. This removes the visitor-IP leak to Google's CDN, and drops the inline `onload`
       the old non-blocking-preload trick required (which a strict CSP would have blocked).
       fonts.css is Google's own unicode-range-split output verbatim, so a reader still only
       downloads the subsets their language needs. -->
  <link rel="stylesheet" href="%sveltekit.assets%/fonts/fonts.css" />

  %sveltekit.head%
</head>

<body>
  <div style="display: contents">%sveltekit.body%</div>
</body>

</html>
