<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.ico" sizes="any" />
    <link rel="icon" href="%sveltekit.assets%/favicon-32x32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="%sveltekit.assets%/favicon-16x16.png" sizes="16x16" type="image/png" />
    <link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
    <link rel="manifest" href="%sveltekit.assets%/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- No default page description here on purpose: every prerendered route sets its
         own meta description in its head block, and a hardcoded default would duplicate
         it on every page. -->
    <meta name="theme-color" content="#f8f1e7" />
    <meta name="color-scheme" content="light" />

    <!-- Google Fonts: readable warm theme typography.
         THE single static font request for the whole site. It is a superset of every
         family used statically across routes; reader-selectable and admin-preview fonts
         are still loaded on demand by their own stores.

         This now also carries the three families that used to come from a second request
         — an `@import url(fonts.googleapis.com/...)` on line 1 of app.css. That import
         was the worst case for loading fonts: a CSS @import is only discovered after the
         138 KB stylesheet has itself been downloaded and parsed, and it blocks rendering,
         which quietly cancelled out the non-blocking preload below. It also re-requested
         EB Garamond and Fraunces (already here) with a different set of weights.

         The three families it owned back the design tokens in app.css, so they are
         required, not optional:
           Fraunces    → --font-display
           DM Sans     → --font-body
           EB Garamond → --font-serif
         Their weight sets are merged into the ones already requested here, so nothing
         renders differently — it just arrives in one non-blocking request instead of two,
         one of which blocked.

         Google serves each family split by unicode-range, so a reader on the English site
         never downloads the Cyrillic subsets (and vice versa) despite this one URL. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Non-blocking font load: preload as style, swap rel on load. Prevents render-blocking
         on slow mobile connections while keeping the swap behaviour identical. -->
    <link rel="preload"
          href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300;1,9..40,400&family=EB+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,650;0,9..144,750;1,9..144,300;1,9..144,400&family=Inter:wght@400;500;600;700&family=Instrument+Sans:wght@400;500&display=swap"
          as="style"
          onload="this.onload=null;this.rel='stylesheet'" />
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300;1,9..40,400&family=EB+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,650;0,9..144,750;1,9..144,300;1,9..144,400&family=Inter:wght@400;500;600;700&family=Instrument+Sans:wght@400;500&display=swap" rel="stylesheet" />
    </noscript>

    %sveltekit.head%
  </head>
  <body>
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
