# Baseline security headers, kept in one place.
#
# Why a snippet instead of just declaring these once at server{} level: nginx's
# add_header inheritance is replace-not-merge. A location that declares ANY
# add_header of its own silently drops every add_header inherited from its parent.
# So the moment a location sets Cache-Control, it also loses nosniff/Referrer-Policy/
# X-Frame-Options unless they are restated. `include`-ing this file into each such
# location keeps that from turning into a copy-paste drift bug.
#
# nosniff matters most on /static/ — those are visitor/admin-uploaded files, and
# content-type sniffing on user uploads is exactly how a "harmless" file gets
# interpreted as something executable.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "SAMEORIGIN" always;

# HSTS: force HTTPS for a year, incl. subdomains. Browsers ignore this over plain HTTP,
# so it is safe in this shared snippet. `preload` (submitting to the browser preload list)
# is deliberately omitted — it is a hard-to-reverse commitment; add it once the site is
# permanently HTTPS-only on every subdomain.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# Powerful browser features are allowed for THIS origin (=self) but denied to third-party
# iframes. `(self)` — not `()` — means your OWN code is never blocked: you can add browser
# geolocation, camera, payments, etc. anytime without touching this header; only embedded
# third-party frames are restricted. (Server-side GeoIP / MaxMind is unaffected either way —
# Permissions-Policy governs browser APIs, not backend IP lookups.)
add_header Permissions-Policy "geolocation=(self), microphone=(self), camera=(self), payment=(self), usb=(self), magnetometer=(self), gyroscope=(self), accelerometer=(self)" always;

# Isolate the browsing context. `allow-popups` keeps window.open()/_blank links working
# (the site opens same-origin /figurines links in new tabs) while still severing cross-origin
# opener access.
add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;

# Content-Security-Policy — the ENFORCED, zero-risk subset. These directives cannot break a
# working page but add real protection: clickjacking (frame-ancestors, obsoletes the
# X-Frame-Options above), <base> injection (base-uri), plugin/data-URI object embedding
# (object-src), and form-hijacking (form-action). Every form here posts same-origin.
add_header Content-Security-Policy "base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'" always;
#
# NOT set: a full script-src/style-src XSS policy. That is the hard part and needs a proper
# rollout — collect real violations via a report-to endpoint (report-uri.com or self-hosted),
# then enforce. A report-only header was tried but is useless without a report-to endpoint
# (Safari ignores it entirely), so it was removed rather than left as console noise. When
# ready, the strict policy would look roughly like:
#   default-src 'self';
#   script-src 'self' 'nonce-XXX' https://static.cloudflareinsights.com;   # Cloudflare Analytics
#   style-src  'self' 'unsafe-inline' https://fonts.googleapis.com;         # or self-host reader fonts
#   font-src   'self' https://fonts.gstatic.com data:;                      # reader/admin fonts still use Google
#   img-src 'self' data: blob: https:; media-src 'self';
#   connect-src 'self' https://cloudflareinsights.com;
#   frame-src 'self'; base-uri 'self'; object-src 'none';
#   frame-ancestors 'self'; form-action 'self'
# Replacing 'unsafe-inline' with a per-response nonce on the inline JSON-LD is the main work.
