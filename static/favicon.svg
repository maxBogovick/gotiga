<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">Ritunia maker mark favicon</title>
  <desc id="desc">A restrained lowercase r maker mark stamped into a warm clay seal.</desc>
  <defs>
    <radialGradient id="clay" cx="34%" cy="24%" r="78%">
      <stop offset="0" stop-color="#f7d7a7" />
      <stop offset="0.58" stop-color="#b66a43" />
      <stop offset="1" stop-color="#5c2c22" />
    </radialGradient>
    <radialGradient id="paper" cx="38%" cy="28%" r="76%">
      <stop offset="0" stop-color="#fff6e7" />
      <stop offset="0.72" stop-color="#ecd5b3" />
      <stop offset="1" stop-color="#bc895e" />
    </radialGradient>
    <filter id="press" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#1f1712" flood-opacity="0.24" />
    </filter>
  </defs>

  <circle cx="64" cy="64" r="58" fill="url(#clay)" />
  <circle cx="64" cy="64" r="48" fill="url(#paper)" filter="url(#press)" />
  <text
    x="62"
    y="88"
    fill="#211812"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="86"
    font-style="italic"
    font-weight="700"
    letter-spacing="0"
    text-anchor="middle"
  >r</text>
  <path
    d="M83 86c10-4 17-11 21-21"
    fill="none"
    stroke="#8d4c32"
    stroke-linecap="round"
    stroke-width="5"
    opacity="0.72"
  />
  <circle cx="94" cy="87" r="6" fill="#211812" opacity="0.94" />
</svg>
