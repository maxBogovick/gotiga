<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f8f1e7" />
  <meta name="robots" content="noindex" />
  <title>Ritunia</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: grid; place-items: center; padding: 24px;
      background: #f8f1e7; color: #34251c;
      font-family: Georgia, 'Times New Roman', serif;
    }
    main { max-width: 26rem; text-align: center; }
    img { width: 112px; height: 112px; margin: 0 auto 24px; display: block; opacity: 0.9; }
    h1 { margin: 0 0 12px; font-size: 1.6rem; font-weight: 400; letter-spacing: 0.01em; }
    p { margin: 0 0 28px; line-height: 1.55; color: #5a4636; }
    button {
      font: inherit; font-size: 1rem; cursor: pointer;
      padding: 12px 28px; min-height: 44px;
      color: #f8f1e7; background: #6f3b24;
      border: 1px solid #6f3b24; border-radius: 999px;
    }
    button:hover { background: #34251c; }
    button:focus-visible { outline: 2px solid #c65f3c; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <img src="/pwa/icon-192.png" alt="" width="112" height="112" />
    <h1 id="title">You’re offline</h1>
    <p id="text">This page isn’t saved on this device. Pages you’ve already opened stay available. Reconnect and try again.</p>
    <button id="retry" type="button">Try again</button>
  </main>
  <script>
    (function () {
      var words = {
        en: ['You’re offline', 'This page isn’t saved on this device. Pages you’ve already opened stay available. Reconnect and try again.', 'Try again'],
        ru: ['Нет сети', 'Эта страница не сохранена на устройстве. Уже открытые страницы доступны без интернета. Подключитесь и повторите.', 'Повторить'],
        uk: ['Немає мережі', 'Цю сторінку не збережено на пристрої. Уже відкриті сторінки доступні без інтернету. Підключіться й повторіть.', 'Повторити'],
        es: ['Sin conexión', 'Esta página no está guardada en este dispositivo. Las páginas que ya abriste siguen disponibles. Vuelve a conectarte e inténtalo de nuevo.', 'Reintentar'],
        de: ['Keine Verbindung', 'Diese Seite ist auf diesem Gerät nicht gespeichert. Bereits geöffnete Seiten bleiben verfügbar. Verbinde dich und versuche es erneut.', 'Erneut versuchen'],
        it: ['Nessuna connessione', 'Questa pagina non è salvata su questo dispositivo. Le pagine già aperte restano disponibili. Riconnettiti e riprova.', 'Riprova']
      };
      // Язык: выбор читателя, затем язык браузера (как на сайте), иначе английский.
      var lang = 'en';
      try {
        var chosen = localStorage.getItem('gotiga_lang');
        var list = chosen ? [chosen] : (navigator.languages || [navigator.language || 'en']);
        for (var i = 0; i < list.length; i++) {
          var code = String(list[i]).slice(0, 2).toLowerCase();
          if (words[code]) { lang = code; break; }
        }
      } catch (e) {}
      var w = words[lang];
      document.documentElement.lang = lang;
      document.getElementById('title').textContent = w[0];
      document.getElementById('text').textContent = w[1];
      var button = document.getElementById('retry');
      button.textContent = w[2];
      button.addEventListener('click', function () { location.reload(); });
      // Сеть вернулась — страница открывается сама.
      window.addEventListener('online', function () { location.reload(); });
    })();
  </script>
</body>
</html>
